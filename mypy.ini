[mypy]
# Keep the project permissive by default; tighten as we add more annotations.
python_version = 3.11

# Tighten checks
strict = True

# We provide minimal local stubs for a few scipy submodules used in the
# project under the `stubs/` directory so we can avoid global ignores.
mypy_path = stubs

# Exclude test files from strict type checking (pytest convention)
[mypy-tests.*]
ignore_errors = True

# Third-party packages without type stubs or py.typed marker
[mypy-scipy.signal]
ignore_missing_imports = True

[mypy-scipy.ndimage]
ignore_missing_imports = True

[mypy-tqdm.auto]
ignore_missing_imports = True

[mypy-plotly.graph_objects]
ignore_missing_imports = True

[mypy-plotly]
ignore_missing_imports = True

[mypy-mpl_toolkits.mplot3d]
ignore_missing_imports = True

# Intentional operator overlaps in Quantity for convenience
[mypy-src.utils.quantity]
disable_error_code = misc