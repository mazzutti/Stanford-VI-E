[mypy]
# Keep the project permissive by default; tighten as we add more annotations.
python_version = 3.11

# Tighten checks
strict = True

# We provide minimal local stubs for a few scipy submodules used in the
# project under the `stubs/` directory so we can avoid global ignores.
mypy_path = stubs

# Suppress numpy generic type parameter warnings (numpy uses complex generics that are hard to fully type)
disable_error_code = type-arg

# Exclude test files from strict type checking (pytest convention)
[mypy-tests.*]
ignore_errors = True